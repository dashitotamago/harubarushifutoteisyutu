<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shifly - スタッフ</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; background:#f8fafc; color:#0f172a; padding-bottom:70px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 14px; }
  a.back { font-size:12px; color:#94a3b8; text-decoration:none; }
  h2 { font-size:16px; margin: 12px 0 16px; display:flex; align-items:center; gap:8px; }
  label { display:block; font-size:12px; color:#64748b; margin-bottom:4px; }
  input, select { width:100%; border:1px solid #cbd5e1; border-radius:8px; padding:9px 10px; font-size:14px; margin-bottom:12px; font-family:inherit; }
  button { background:#0d9488; color:#fff; border:none; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; width:100%; }
  button.secondary { background:#fff; color:#334155; border:1px solid #cbd5e1; }
  .error { color:#e11d48; font-size:12px; margin: -6px 0 12px; }
  .hint { background:#f0fdfa; color:#0f766e; font-size:12px; padding:8px 10px; border-radius:8px; margin-bottom:12px; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .top .name { font-weight:700; font-size:15px; }
  .logout { font-size:12px; color:#94a3b8; background:none; border:none; width:auto; cursor:pointer; }
  .statgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
  .statbox { background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:8px 10px; }
  .statbox .l { font-size:10px; color:#94a3b8; }
  .statbox .v { font-size:14px; font-weight:700; }
  .monthnav { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:10px; }
  .monthnav button { width:auto; background:none; color:#334155; border:1px solid #cbd5e1; padding:4px 10px; }
  .monthnav .label { font-weight:600; font-size:14px; }
  .toolrow { display:flex; justify-content:space-between; margin-bottom:14px; font-size:12px; }
  .toolrow a { color:#0d9488; cursor:pointer; text-decoration:none; }
  .toolrow a.danger { color:#94a3b8; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:14px; margin-bottom:10px; }
  .cardtop { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .datelabel { font-size:13px; font-weight:700; }
  .datelabel.sun { color:#e11d48; } .datelabel.sat { color:#0284c7; }
  .del { color:#e11d48; background:none; border:none; width:auto; font-size:12px; cursor:pointer; }
  .timerow { display:flex; align-items:center; gap:8px; border:1px solid #e2e8f0; border-radius:8px; padding:6px 8px; margin-bottom:8px; }
  .timerow input[type=time] { border:none; margin:0; padding:2px; flex:1; }
  .dayoffbox { display:flex; justify-content:space-between; align-items:center; background:#f1f5f9; border-radius:8px; padding:8px 10px; margin-bottom:8px; font-size:13px; color:#64748b; }
  .dayoffbox a { color:#0d9488; font-size:12px; cursor:pointer; }
  .togglelink { font-size:11px; color:#94a3b8; cursor:pointer; margin-bottom:8px; display:inline-block; }
  .memoinput { background:#f8fafc; font-size:12px; margin-bottom:8px; }
  .countbar { display:flex; justify-content:space-between; background:#f8fafc; border-radius:8px; padding:6px 10px; font-size:11px; color:#64748b; }
  .bottombar { position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,.97); border-top:1px solid #e2e8f0; padding:10px 20px; display:flex; justify-content:space-between; align-items:center; }
  .bottombar .days { font-size:12px; color:#64748b; }
  .bottombar button { width:auto; padding:9px 20px; }
  .hidden { display:none; }
  #loading { text-align:center; color:#94a3b8; padding:60px 0; font-size:13px; }
  .banner { display:flex; align-items:center; gap:8px; background:#f0fdfa; border:1px solid #99f6e4; color:#0f766e; border-radius:10px; padding:10px 12px; margin-bottom:14px; font-size:12px; }
  .deadlinewarn { background:#fef3c7; border:1px solid #f59e0b; color:#92400e; border-radius:10px; padding:10px 12px; margin-bottom:14px; font-size:12px; }
  .namegrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .namebtn {
    background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:18px 10px; text-align:center;
    font-weight:600; font-size:14px; cursor:pointer; color:#0f172a;
  }
  .namebtn:hover { border-color:#5eead4; }

  /* 上部の画面切替タブ */
  .maintabs { display:flex; gap:6px; margin-bottom:14px; }
  .maintab { flex:1; text-align:center; padding:8px 10px; border-radius:8px; font-size:13px; cursor:pointer; background:#fff; border:1px solid #e2e8f0; color:#64748b; }
  .maintab.active { background:#0f172a; color:#fff; border-color:#0f172a; }

  /* 確定シフト確認(日別/半月/月) */
  .tabs { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .tab { padding:6px 10px; border-radius:8px; font-size:12px; cursor:pointer; background:#fff; border:1px solid #e2e8f0; color:#64748b; }
  .tab.active { background:#0f172a; color:#fff; border-color:#0f172a; }
  .navrow { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .datebar { display:flex; align-items:center; gap:6px; border:1px solid #e2e8f0; border-radius:8px; padding:5px 8px; background:#fff; }
  .datebar input { width:auto; margin:0; padding:2px; border:none; }
  .gridwrap { width:100%; background:#fff; border:1px solid #e2e8f0; border-radius:14px; }
  .gridinner { width:100%; }
  .ghead { display:flex; border-bottom:1px solid #f1f5f9; }
  .gnamecol { width:80px; flex-shrink:0; padding:6px 6px; font-size:9px; color:#94a3b8; font-weight:600; }
  .ghours { display:flex; flex:1; }
  .ghour { flex:1; min-width:0; text-align:center; font-size:8px; color:#94a3b8; padding:5px 0; border-left:1px solid #f8fafc; overflow:hidden; white-space:nowrap; }
  .growrap { display:flex; border-bottom:1px solid #f8fafc; }
  .gname { width:80px; flex-shrink:0; padding:6px; }
  .gname .n { font-size:11px; font-weight:700; color:#334155; }
  .gtrack { position:relative; flex:1; padding:8px 0; }
  .glines { position:absolute; inset:0; display:flex; pointer-events:none; }
  .gline { flex:1; border-left:1px solid #f8fafc; }
  .gasn { position:relative; height:26px; }
  .gasnbar {
    position:absolute; top:0; height:26px; background:#dcfce7; border:1px solid #4ade80; border-radius:4px;
    font-size:10px; font-weight:700; color:#166534; line-height:24px; padding:0 5px; overflow:hidden; white-space:nowrap;
  }
  .gasnbreak { position:absolute; top:0; height:26px; background:rgba(255,255,255,.65); border-left:1px dashed #4ade80; border-right:1px dashed #4ade80; }
  .glegend { display:flex; gap:12px; font-size:10px; color:#94a3b8; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .glegend .sw { display:inline-block; width:14px; height:8px; border-radius:3px; vertical-align:middle; margin-right:4px; }
  #periodTable { table-layout:fixed; width:100%; font-size:10px; }
  #periodTable th, #periodTable td { text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:4px 2px; border-bottom:1px solid #f8fafc; }
  #periodTable th:first-child, #periodTable td:first-child { text-align:left; background:#fff; width:60px; padding-left:5px; }
  #periodTable td.pcell.on { background:#f0fdfa; color:#0f766e; font-weight:600; }
  #periodTable .pname { font-weight:700; color:#334155; font-size:10px; }
  #periodTable .phours { font-size:8px; color:#0d9488; }
</style>
</head>
<body>
<div class="wrap">
  
  <div id="loading">読み込み中...</div>

  <!-- ログイン -->
  <div id="loginView" class="hidden">
    <h2>🧑 スタッフログイン</h2>

    <div id="stepId">
      <label>お名前を選んでください</label>
      <div id="nameGrid" class="namegrid"></div>
      <div id="idError" class="error hidden"></div>
    </div>

    <div id="stepSetup" class="hidden">
      <div class="hint" id="setupHint"></div>
      <label>新しいパスワード</label>
      <input id="pw1" type="password" />
      <label>新しいパスワード(確認)</label>
      <input id="pw2" type="password" />
      <div id="setupError" class="error hidden"></div>
      <button onclick="submitSetup()">設定してログイン</button>
    </div>

    <div id="stepPassword" class="hidden">
      <div class="hint" id="pwHint"></div>
      <label>パスワード</label>
      <input id="pwInput" type="password" />
      <div id="pwError" class="error hidden"></div>
      <button onclick="submitPassword()">ログイン</button>
    </div>
  </div>

  <!-- ログイン後 -->
  <div id="mainView" class="hidden">
    <div class="top">
      <div class="name" id="staffNameLabel"></div>
      <button class="logout" onclick="logout()">ログアウト</button>
    </div>

    <div class="maintabs">
      <div class="maintab active" data-main="submit" onclick="switchMainView('submit')">シフト提出</div>
      <div class="maintab" data-main="confirm" onclick="switchMainView('confirm')">確定シフト確認</div>
    </div>

    <!-- シフト提出 -->
    <div id="submitSection">
      <div id="banner" class="banner hidden">✅ シフトの提出が完了しました!</div>

      <div class="monthnav">
        <button onclick="changeMonth(-1)">←</button>
        <div class="label" id="monthLabel"></div>
        <button onclick="changeMonth(1)">→</button>
      </div>

      <div id="deadlineBanner"></div>

      <div class="toolrow">
        <a onclick="autofill()">✨ 提出履歴から自動入力</a>
        <a class="danger" onclick="clearAll()">全削除</a>
      </div>

      <div id="cardList"></div>
    </div>

    <!-- 確定シフト確認(閲覧専用) -->
    <div id="confirmSection" class="hidden">
      <div class="tabs">
        <div class="tab active" data-view="day" onclick="switchConfirmView('day')">日別</div>
        <div class="tab" data-view="2week" onclick="switchConfirmView('2week')">前半・後半</div>
        <div class="tab" data-view="month" onclick="switchConfirmView('month')">1ヶ月</div>
      </div>

      <!-- 日別 -->
      <div id="confirmDayView">
        <div class="navrow">
          <button class="secondary small" onclick="confirmDayChange(-1)">←</button>
          <div class="datebar"><input id="confirmDate" type="date" onchange="renderConfirmDay()" /></div>
          <button class="secondary small" onclick="confirmDayChange(1)">→</button>
          <button class="secondary small" onclick="confirmDayToday()">今日</button>
        </div>
        <div class="gridwrap">
          <div class="gridinner">
            <div class="ghead">
              <div class="gnamecol">スタッフ</div>
              <div class="ghours" id="cghours"></div>
            </div>
            <div id="confirmGridRows"></div>
          </div>
        </div>
        <div class="glegend">
          <span><span class="sw" style="background:#dcfce7; border:1px solid #4ade80"></span>確定シフト(白い切れ目=休憩)</span>
        </div>
      </div>

      <!-- 半月・月 -->
      <div id="confirmPeriodView" class="hidden">
        <div class="navrow">
          <button class="secondary small" onclick="confirmPeriodChange(-1)">←</button>
          <div id="confirmPeriodLabel" style="font-weight:600; font-size:13px;"></div>
          <button class="secondary small" onclick="confirmPeriodChange(1)">→</button>
          <button class="secondary small" onclick="confirmPeriodToday()">今日</button>
        </div>
        <div class="gridwrap">
          <table id="periodTable">
            <thead><tr id="confirmPeriodHead"></tr></thead>
            <tbody id="confirmPeriodBody"></tbody>
          </table>
        </div>
        <p class="muted">スタッフ名の横の時間は、その期間の確定シフト合計時間(休憩を除く)です。</p>
      </div>
    </div>
  </div>

  <div id="bottombar" class="bottombar hidden">
    <div class="days">出勤日数: <span id="workDaysCount">0</span>日</div>
    <button onclick="submitDone()">シフトを提出</button>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz0rDq-wtdhfK8kVhPLdEhj3a7v4p8DyU25tExyRXa-k4oRw0whUIDP44GT2E6wN_eoDQ/exec";
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function yen(n) {
  return "¥" + Math.round(Number(n) || 0).toLocaleString("ja-JP");
}
function toMin(hhmm) {
  if (!hhmm) return 0;
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}
async function apiCall(url, action, payload) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, payload: payload || {} }),
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "unknown error");
  return json.data;
}

let loggedInStaff = null;
let pendingStaff = null;
let myShifts = [];       // このスタッフの希望シフト全件
let monthCounts = {};    // 全スタッフ分の日別集計(休み希望人数・勤務希望人数)
let ym = (() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() + 1 }; })();

let staffListCache = [];
let positionListCache = [];

async function init() {
  document.getElementById("loading").classList.add("hidden");
  document.getElementById("loginView").classList.remove("hidden");
  const grid = document.getElementById("nameGrid");
  const errEl = document.getElementById("idError");
  try {
    staffListCache = await apiCall(API_URL, "getStaffList");
    positionListCache = await apiCall(API_URL, "getPositions");
    grid.innerHTML = "";
    staffListCache.forEach((s) => {
      const btn = document.createElement("div");
      btn.className = "namebtn";
      btn.textContent = s.name;
      btn.onclick = () => selectStaffName(s);
      grid.appendChild(btn);
    });
    if (staffListCache.length === 0) {
      errEl.textContent = "スタッフが登録されていません。管理者に登録を依頼してください。";
      errEl.classList.remove("hidden");
    }
  } catch (e) {
    errEl.textContent = "通信エラー: " + e.message;
    errEl.classList.remove("hidden");
  }
}
init();

function selectStaffName(staff) {
  const errEl = document.getElementById("idError");
  errEl.classList.add("hidden");
  pendingStaff = staff;
  document.getElementById("stepId").classList.add("hidden");
  if (!staff.hasPassword) {
    document.getElementById("setupHint").textContent = staff.name + " さん、初めてのログインですね。パスワードを設定してください。";
    document.getElementById("stepSetup").classList.remove("hidden");
  } else {
    document.getElementById("pwHint").textContent = staff.name + " さん、パスワードを入力してください。";
    document.getElementById("stepPassword").classList.remove("hidden");
  }
}

async function submitSetup() {
  const pw1 = document.getElementById("pw1").value;
  const pw2 = document.getElementById("pw2").value;
  const err = document.getElementById("setupError");
  err.classList.add("hidden");
  if (pw1.length < 4) { err.textContent = "パスワードは4文字以上で設定してください。"; err.classList.remove("hidden"); return; }
  if (pw1 !== pw2) { err.textContent = "パスワードが一致しません。"; err.classList.remove("hidden"); return; }
  try {
    const result = await apiCall(API_URL, "setStaffPassword", { id: pendingStaff.id, password: pw1 });
    if (!result.ok) {
      err.textContent = "パスワードの保存に失敗しました。もう一度お名前の選択からやり直してください。";
      err.classList.remove("hidden");
      return;
    }
    // このセッション内で名前一覧を使い回しても「未設定」のまま扱われないよう、ローカルのキャッシュも更新しておく
    const cached = staffListCache.find((s) => s.id === pendingStaff.id);
    if (cached) cached.hasPassword = true;
    loggedInStaff = pendingStaff;
    await showMain();
  } catch (e) {
    err.textContent = "通信エラー: " + e.message;
    err.classList.remove("hidden");
  }
}

async function submitPassword() {
  const pw = document.getElementById("pwInput").value;
  const err = document.getElementById("pwError");
  err.classList.add("hidden");
  try {
    const result = await apiCall(API_URL, "staffLogin", { name: pendingStaff.name, password: pw });
    if (!result.ok) { err.textContent = "パスワードが違います。"; err.classList.remove("hidden"); return; }
    loggedInStaff = result.staff;
    await showMain();
  } catch (e) {
    err.textContent = "通信エラー: " + e.message;
    err.classList.remove("hidden");
  }
}

function logout() {
  loggedInStaff = null; pendingStaff = null;
  document.getElementById("mainView").classList.add("hidden");
  document.getElementById("bottombar").classList.add("hidden");
  document.getElementById("loginView").classList.remove("hidden");
  document.getElementById("stepId").classList.remove("hidden");
  document.getElementById("stepSetup").classList.add("hidden");
  document.getElementById("stepPassword").classList.add("hidden");
}

async function showMain() {
  document.getElementById("loginView").classList.add("hidden");
  document.getElementById("mainView").classList.remove("hidden");
  document.getElementById("bottombar").classList.remove("hidden");
  document.getElementById("staffNameLabel").textContent = loggedInStaff.name + " さん";
  await refreshAll();
}

/* ---- シフト提出 / 確定シフト確認 の切替 ---- */
function switchMainView(key) {
  document.querySelectorAll(".maintab").forEach((t) => t.classList.toggle("active", t.dataset.main === key));
  document.getElementById("submitSection").classList.toggle("hidden", key !== "submit");
  document.getElementById("confirmSection").classList.toggle("hidden", key !== "confirm");
  document.getElementById("bottombar").classList.toggle("hidden", key !== "submit");
  if (key === "confirm") {
    if (!document.getElementById("confirmDate").value) document.getElementById("confirmDate").value = todayStr();
    if (confirmViewMode === "day") renderConfirmDay();
    else renderConfirmPeriod();
  }
}

/* ==== 確定シフト確認(全スタッフ・閲覧専用) ==== */
const CGRID_START_HOUR = 8; // シフト管理画面と合わせて8時〜24時
const CGRID_END_HOUR = 24;
const CGRID_HOURS = Array.from({ length: CGRID_END_HOUR - CGRID_START_HOUR }, (_, i) => CGRID_START_HOUR + i);
const CGRID_RANGE_MIN = (CGRID_END_HOUR - CGRID_START_HOUR) * 60;
let confirmDateVal = todayStr();
let confirmViewMode = "day"; // day | 2week | month
let confirmPeriodAnchor = todayStr();

function switchConfirmView(mode) {
  confirmViewMode = mode;
  document.querySelectorAll('.tabs .tab[data-view]').forEach((t) => t.classList.toggle("active", t.dataset.view === mode));
  document.getElementById("confirmDayView").classList.toggle("hidden", mode !== "day");
  document.getElementById("confirmPeriodView").classList.toggle("hidden", mode === "day");
  if (mode === "day") renderConfirmDay();
  else renderConfirmPeriod();
}

function cClampMin(min) { return Math.max(CGRID_START_HOUR * 60, Math.min(CGRID_END_HOUR * 60, min)); }
function cPos(start, end) {
  let s = toMin(start);
  let e = toMin(end);
  if (e <= s) e += 24 * 60; // 終了時刻が開始より前(=日をまたぐ)場合は翌日として扱う
  const left = ((cClampMin(s) - CGRID_START_HOUR * 60) / CGRID_RANGE_MIN) * 100;
  let width = ((cClampMin(e) - cClampMin(s)) / CGRID_RANGE_MIN) * 100;
  if (width > 0 && width < 1.5) width = 1.5;
  return { left, width };
}
function cHours(a) {
  const breakMin = (a.breakStart && a.breakEnd) ? Math.max(0, toMin(a.breakEnd) - toMin(a.breakStart)) : 0;
  return Math.max(0, toMin(a.end) - toMin(a.start) - breakMin) / 60;
}

function confirmDayChange(n) {
  confirmDateVal = addDays(document.getElementById("confirmDate").value || confirmDateVal, n);
  document.getElementById("confirmDate").value = confirmDateVal;
  renderConfirmDay();
}
function confirmDayToday() {
  confirmDateVal = todayStr();
  document.getElementById("confirmDate").value = confirmDateVal;
  renderConfirmDay();
}

async function renderConfirmDay() {
  const date = document.getElementById("confirmDate").value || confirmDateVal;
  confirmDateVal = date;
  document.getElementById("cghours").innerHTML = CGRID_HOURS.map((h) => `<div class="ghour">${h}時</div>`).join("");
  const rows = document.getElementById("confirmGridRows");
  rows.innerHTML = `<div class="muted" style="padding:14px;">読み込み中...</div>`;
  let dayData;
  try {
    dayData = await apiCall(API_URL, "getDayData", { date });
  } catch (e) {
    rows.innerHTML = `<div class="error" style="padding:14px;">読み込みに失敗しました: ${e.message}</div>`;
    return;
  }
  rows.innerHTML = "";
  staffListCache.forEach((s) => {
    const mine = dayData.assigned.filter((a) => a.staffId === s.id);
    const asg = mine.length ? mine[mine.length - 1] : null;
    const dayH = mine.reduce((sum, a) => sum + cHours(a), 0);
    const barHtml = asg ? (() => {
      const p = cPos(asg.start, asg.end);
      const hasBreak = asg.breakStart && asg.breakEnd;
      const breakHtml = hasBreak ? (() => {
        const bp = cPos(asg.breakStart, asg.breakEnd);
        return `<div class="gasnbreak" style="left:${bp.left}%; width:${bp.width}%"></div>`;
      })() : "";
      if (asg.segments && asg.segments.length > 0) {
        const segBars = asg.segments.map((seg) => {
          const sp = cPos(seg.start, seg.end);
          const pos = positionListCache.find((x) => x.id === seg.positionId);
          const color = pos ? pos.color : "#cbd5e1";
          const label = pos ? pos.name : "?";
          return `<div class="gasnbar" style="left:${sp.left}%; width:${sp.width}%; background:${color}; border-color:${color};">${label} ${seg.start}-${seg.end}</div>`;
        }).join("");
        return segBars + breakHtml;
      }
      return `<div class="gasnbar" style="left:${p.left}%; width:${p.width}%">${asg.start}-${asg.end}</div>${breakHtml}`;
    })() : "";
    const row = document.createElement("div");
    row.className = "growrap";
    row.innerHTML = `
      <div class="gname"><div class="n">${s.name}${dayH > 0 ? ` <span class="phours">(${dayH.toFixed(1)}h)</span>` : ""}</div></div>
      <div class="gtrack">
        <div class="glines">${CGRID_HOURS.map(() => '<div class="gline"></div>').join("")}</div>
        <div class="gasn">${barHtml}</div>
      </div>
    `;
    rows.appendChild(row);
  });
  if (staffListCache.length === 0) {
    rows.innerHTML = `<div class="muted" style="padding:14px;">スタッフが登録されていません</div>`;
  }
}

function pad2c(n) { return String(n).padStart(2, "0"); }

function confirmHalfPeriodDates(anchorDate) {
  const d = new Date(anchorDate + "T00:00:00");
  const y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
  if (day <= 15) return Array.from({ length: 15 }, (_, i) => `${y}-${pad2c(m)}-${pad2c(i + 1)}`);
  const last = new Date(y, m, 0).getDate();
  return Array.from({ length: last - 15 }, (_, i) => `${y}-${pad2c(m)}-${pad2c(16 + i)}`);
}
function confirmShiftHalfPeriod(anchorDate, dir) {
  const d = new Date(anchorDate + "T00:00:00");
  const y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
  const isFirstHalf = day <= 15;
  if (dir > 0) {
    if (isFirstHalf) return `${y}-${pad2c(m)}-16`;
    const nd = new Date(y, m, 1);
    return `${nd.getFullYear()}-${pad2c(nd.getMonth() + 1)}-01`;
  }
  if (!isFirstHalf) return `${y}-${pad2c(m)}-01`;
  const pd = new Date(y, m - 2, 16);
  return `${pd.getFullYear()}-${pad2c(pd.getMonth() + 1)}-16`;
}

function confirmPeriodDates() {
  if (confirmViewMode === "2week") return confirmHalfPeriodDates(confirmPeriodAnchor);
  const d = new Date(confirmPeriodAnchor + "T00:00:00");
  const y = d.getFullYear(), m = d.getMonth() + 1;
  const last = new Date(y, m, 0).getDate();
  return Array.from({ length: last }, (_, i) => `${y}-${pad2c(m)}-${pad2c(i + 1)}`);
}

function confirmPeriodChange(n) {
  if (confirmViewMode === "2week") {
    confirmPeriodAnchor = confirmShiftHalfPeriod(confirmPeriodAnchor, n);
  } else {
    const d = new Date(confirmPeriodAnchor + "T00:00:00");
    d.setMonth(d.getMonth() + n);
    confirmPeriodAnchor = `${d.getFullYear()}-${pad2c(d.getMonth() + 1)}-01`;
  }
  renderConfirmPeriod();
}
function confirmPeriodToday() {
  confirmPeriodAnchor = todayStr();
  renderConfirmPeriod();
}

async function renderConfirmPeriod() {
  const dates = confirmPeriodDates();
  let label;
  if (confirmViewMode === "2week") {
    const y = Number(dates[0].slice(0, 4));
    const m = Number(dates[0].slice(5, 7));
    const isFirstHalf = Number(dates[0].slice(8, 10)) === 1;
    label = `${y}年${m}月${isFirstHalf ? "前半(1〜15日)" : "後半(16〜" + dates[dates.length - 1].slice(8, 10) + "日)"}`;
  } else {
    label = dates[0].slice(0, 7);
  }
  document.getElementById("confirmPeriodLabel").textContent = label;

  const headRow = document.getElementById("confirmPeriodHead");
  headRow.innerHTML = `<th>スタッフ</th>` + dates.map((d) => `<th>${Number(d.slice(5,7))}/${Number(d.slice(8,10))}</th>`).join("");

  const body = document.getElementById("confirmPeriodBody");
  body.innerHTML = `<tr><td colspan="${dates.length+1}" class="muted" style="padding:10px;">読み込み中...</td></tr>`;
  let periodData;
  try {
    periodData = await apiCall(API_URL, "getPeriodData", { startDate: dates[0], endDate: dates[dates.length - 1] });
  } catch (e) {
    body.innerHTML = `<tr><td colspan="${dates.length+1}" class="error" style="padding:10px;">読み込みに失敗しました: ${e.message}</td></tr>`;
    return;
  }
  body.innerHTML = "";
  staffListCache.forEach((s) => {
    const mine = periodData.assigned.filter((a) => a.staffId === s.id);
    const totalHours = mine.reduce((sum, a) => sum + cHours(a), 0);
    const byDate = {};
    mine.forEach((a) => { byDate[a.date] = a; });
    const tr = document.createElement("tr");
    const nameCell = `<td><div class="pname">${s.name}</div><div class="phours">${totalHours.toFixed(1)}時間</div></td>`;
    const cells = dates.map((d) => {
      const a = byDate[d];
      return a ? `<td class="pcell on">${a.start}-${a.end}</td>` : `<td class="pcell"></td>`;
    }).join("");
    tr.innerHTML = nameCell + cells;
    body.appendChild(tr);
  });
  if (staffListCache.length === 0) {
    body.innerHTML = `<tr><td colspan="${dates.length+1}" class="muted" style="padding:10px;">スタッフが登録されていません</td></tr>`;
  }
}

function changeMonth(n) {
  const total = ym.y * 12 + (ym.m - 1) + n;
  ym = { y: Math.floor(total / 12), m: (total % 12) + 1 };
  refreshAll();
}

function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function pad2(n) { return String(n).padStart(2, "0"); }
function dateStr(y, m, day) { return `${y}-${pad2(m)}-${pad2(day)}`; }
const WEEKDAY_JP = ["日","月","火","水","木","金","土"];

async function refreshAll() {
  document.getElementById("monthLabel").textContent = `${ym.y}年${ym.m}月`;
  const list = document.getElementById("cardList");
  list.innerHTML = `<p style="text-align:center; color:#94a3b8; font-size:13px;">読み込み中...</p>`;
  try {
    // 1回のAPI呼び出しで、自分のシフト履歴と月間集計を両方まとめて取得(通信回数を減らして軽量化)
    const [data, status] = await Promise.all([
      apiCall(API_URL, "getStaffPageData", { staffId: loggedInStaff.id, year: ym.y, month: ym.m }),
      apiCall(API_URL, "getSubmissionStatus", { year: ym.y, month: ym.m }),
    ]);
    myShifts = data.myShifts;
    monthCounts = data.monthCounts;
    submissionStatus = status;
    renderDeadlineBanner();
    renderCards();
  } catch (e) {
    list.innerHTML = `<p style="text-align:center; color:#e11d48; font-size:13px;">読み込みに失敗しました: ${e.message}</p>`;
  }
}

let submissionStatus = null;

function renderDeadlineBanner() {
  const el = document.getElementById("deadlineBanner");
  if (!submissionStatus) { el.innerHTML = ""; return; }
  const closed = [];
  if (!submissionStatus.first.open) closed.push(`1〜15日分(期限: ${submissionStatus.first.deadline})`);
  if (!submissionStatus.second.open) closed.push(`16日〜月末分(期限: ${submissionStatus.second.deadline})`);
  if (closed.length === 0) { el.innerHTML = ""; return; }
  el.innerHTML = `<div class="deadlinewarn">⚠️ ${closed.join("・")}は提出期限を過ぎているため、編集できません。管理者に期限の解除を依頼してください。</div>`;
}

function renderCards() {
  const list = document.getElementById("cardList");
  list.innerHTML = "";
  const n = daysInMonth(ym.y, ym.m);
  let workDays = 0;

  for (let day = 1; day <= n; day++) {
    const date = dateStr(ym.y, ym.m, day);
    const mine = myShifts.find((s) => s.date === date);
    const isOff = mine && (mine.isDayOff === true || mine.isDayOff === "TRUE" || mine.isDayOff === "true");
    const hasWork = mine && mine.start && mine.end && !isOff;
    if (hasWork) workDays++;
    const wd = new Date(date + "T00:00:00").getDay();
    const wdClass = wd === 0 ? "sun" : wd === 6 ? "sat" : "";

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="cardtop">
        <div class="datelabel ${wdClass}">${ym.m}/${day}(${WEEKDAY_JP[wd]})</div>
        ${mine ? `<button class="del" onclick="deleteDay('${date}')">削除</button>` : ""}
      </div>
      ${isOff ? `
        <div class="dayoffbox">
          <span>この日は休み希望です</span>
          <a onclick="toggleDayOff('${date}', false)">取り消す</a>
        </div>
      ` : `
        <div class="timerow">
          <input type="time" id="start_${date}" value="${hasWork ? mine.start : ""}" onchange="timeChanged('${date}')">
          <span>〜</span>
          <input type="time" id="end_${date}" value="${hasWork ? mine.end : ""}" onchange="timeChanged('${date}')">
        </div>
        <a class="togglelink" onclick="toggleDayOff('${date}', true)">この日は休み希望にする</a>
      `}
      <input class="memoinput" placeholder="メモがあれば入力" id="memo_${date}" value="${mine && mine.memo ? mine.memo : ""}" onchange="memoChanged('${date}')" ${isOff ? "" : ""}>
    `;
    list.appendChild(card);
  }
  document.getElementById("workDaysCount").textContent = workDays;
}

function submissionClosedAlert() {
  alert("この日は提出期限を過ぎているため、変更できません。管理者に期限の解除を依頼してください。");
}

async function timeChanged(date) {
  const start = document.getElementById("start_" + date).value;
  const end = document.getElementById("end_" + date).value;
  if (!start || !end) return;
  if (toMin(start) >= toMin(end)) { alert("終了時刻は開始時刻より後にしてください"); return; }
  const memoEl = document.getElementById("memo_" + date);
  try {
    await apiCall(API_URL, "submitShift", { staffId: loggedInStaff.id, date, start, end, memo: memoEl ? memoEl.value : "" });
  } catch (e) {
    if (e.message === "submission_closed") { submissionClosedAlert(); await refreshAll(); return; }
    throw e;
  }
  await refreshAll();
}

async function memoChanged(date) {
  const mine = myShifts.find((s) => s.date === date);
  if (!mine || !mine.start || !mine.end) return; // 時間未入力の日はメモだけ先に保存しない(まず時間を入れてもらう)
  const memo = document.getElementById("memo_" + date).value;
  try {
    await apiCall(API_URL, "submitShift", { staffId: loggedInStaff.id, date, start: mine.start, end: mine.end, memo });
  } catch (e) {
    if (e.message === "submission_closed") { submissionClosedAlert(); await refreshAll(); return; }
    throw e;
  }
}

async function toggleDayOff(date, dayOff) {
  try {
    await apiCall(API_URL, "setDayOff", { staffId: loggedInStaff.id, date, dayOff });
  } catch (e) {
    if (e.message === "submission_closed") { submissionClosedAlert(); await refreshAll(); return; }
    throw e;
  }
  await refreshAll();
}

async function deleteDay(date) {
  try {
    await apiCall(API_URL, "deleteShift", { staffId: loggedInStaff.id, date });
  } catch (e) {
    if (e.message === "submission_closed") { submissionClosedAlert(); await refreshAll(); return; }
    throw e;
  }
  await refreshAll();
}

async function clearAll() {
  if (!confirm(`${ym.y}年${ym.m}月の入力内容をすべて削除します。よろしいですか?`)) return;
  const n = daysInMonth(ym.y, ym.m);
  const dates = Array.from({ length: n }, (_, i) => dateStr(ym.y, ym.m, i + 1));
  await apiCall(API_URL, "clearShiftsInRange", { staffId: loggedInStaff.id, dates });
  await refreshAll();
}

async function autofill() {
  const past = myShifts
    .filter((s) => s.date < todayStr() && s.start && s.end && !(s.isDayOff === true || s.isDayOff === "TRUE"))
    .sort((a, b) => b.date.localeCompare(a.date));
  const byWeekday = {};
  past.forEach((s) => {
    const wd = new Date(s.date + "T00:00:00").getDay();
    if (!(wd in byWeekday)) byWeekday[wd] = s;
  });
  const n = daysInMonth(ym.y, ym.m);
  const tasks = [];
  for (let day = 1; day <= n; day++) {
    const date = dateStr(ym.y, ym.m, day);
    const already = myShifts.find((s) => s.date === date);
    if (already) continue;
    const wd = new Date(date + "T00:00:00").getDay();
    const match = byWeekday[wd];
    if (match) {
      tasks.push(apiCall(API_URL, "submitShift", { staffId: loggedInStaff.id, date, start: match.start, end: match.end, memo: "" }));
    }
  }
  if (tasks.length === 0) { alert("自動入力できる履歴がありませんでした。"); return; }
  await Promise.all(tasks);
  await refreshAll();
}

function submitDone() {
  const banner = document.getElementById("banner");
  banner.classList.remove("hidden");
  setTimeout(() => banner.classList.add("hidden"), 3200);
}
</script>
